description: Sync Labs uses a hybrid subscription + pay-per-second usage model. Each tier has a flat monthly subscription price plus a per-second video generation rate that decreases at higher tiers (5%-20% usage discount). Tiers gate maximum video length, concurrent jobs, voice clones, watermarking, team seats, and Batch API access. Enterprise is contact-sales.
sources:
  - https://sync.so/pricing
  - https://sync.so/docs/api-reference/guides/rate-limits
