aid: sync-labs
name: Sync Labs
description: >-
  Sync Labs (sync.so) provides a suite of studio-grade AI lip-sync and visual dubbing APIs. Their technology
  synchronizes video lip movements with any audio track using state-of-the-art models, enabling professional video
  dubbing, content localization, and personalized video generation at scale. Models include sync-3, lipsync-2-pro,
  lipsync-2, lipsync-1.9, and react-1, with support for batch processing (up to 500 videos), webhooks, Python and
  TypeScript SDKs, Adobe Premiere plugin, and ComfyUI integration. Backed by Y Combinator.
