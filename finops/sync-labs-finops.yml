meters:
  - name: subscription_fee
    description: Monthly flat subscription per plan (Hobbyist $5, Creator $19, Growth $49, Scale $249, Enterprise custom).
    unit: month
    aggregation: sum
    dimensions:
      - plan
  - name: generation_seconds
    description: Seconds of generated lip-sync video; metered on completed generations at the plan's per-second rate ($0.05, $0.05, $0.0475, $0.04, custom).
    unit: second
    aggregation: sum
    dimensions:
      - plan
      - model
      - api_key
  - name: voice_clones
    description: Voice clone slots used; capped per plan (3 / 5 / 15 / 50 / custom).
    unit: clones
    aggregation: max
    dimensions:
      - plan
  - name: team_seats
    description: Team seats consumed against per-plan caps (Growth 3, Scale 5, Enterprise custom).
    unit: seat
    aggregation: max
    dimensions:
      - plan
principles:
  - name: Visibility
    description: The Sync dashboard shows generation history; clients can use the List Generations endpoint and webhooks to track per-key usage in near real-time and reconcile against the per-second rate at their plan tier.
  - name: Allocation
    description: Tag spend by API key and (optionally) team seat to attribute generation cost to the consuming product, customer, or workflow. Batch API jobs carry batch identifiers for cleaner allocation.
  - name: Optimization
    description: Move heavy workloads to Growth/Scale to capture the 5%-20% per-second usage discount; use the Batch API on Scale/Enterprise to amortize concurrency caps; cap max video length at the source to avoid paying for trimmed seconds.
  - name: Accountability
    description: Plan owner controls the subscription tier and seat caps; per-key generation rates make it straightforward to assign per-team or per-product chargeback against the plan's per-second rate.
