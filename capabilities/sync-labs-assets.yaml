naftiko: 1.0.0-alpha2
info:
  label: Sync Labs API — Assets
  description: 'Sync Labs API — Assets. 2 operations. Lead operation: List Assets. Self-contained Naftiko capability covering
    one Sync Labs business surface.'
  tags:
  - Sync Labs
  - Assets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SYNC_LABS_API_KEY: SYNC_LABS_API_KEY
capability:
  consumes:
  - type: http
    namespace: sync-labs-assets
    baseUri: https://api.sync.so/v2
    description: Sync Labs API — Assets business capability. Self-contained, no shared references.
    resources:
    - name: assets
      path: /assets
      operations:
      - name: listassets
        method: GET
        description: List Assets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
        - name: type
          in: query
          type: string
          description: Filter by asset type
    - name: assets-id
      path: /assets/{id}
      operations:
      - name: getasset
        method: GET
        description: Get Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Asset ID
          required: true
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SYNC_LABS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: sync-labs-assets-rest
    port: 8080
    description: REST adapter for Sync Labs API — Assets. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/assets
      name: assets
      description: REST surface for assets.
      operations:
      - method: GET
        name: listassets
        description: List Assets
        call: sync-labs-assets.listassets
        with:
          limit: rest.limit
          offset: rest.offset
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/assets/{id}
      name: assets-id
      description: REST surface for assets-id.
      operations:
      - method: GET
        name: getasset
        description: Get Asset
        call: sync-labs-assets.getasset
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sync-labs-assets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sync Labs API — Assets. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-assets
      description: List Assets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sync-labs-assets.listassets
      with:
        limit: tools.limit
        offset: tools.offset
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
    - name: get-asset
      description: Get Asset
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sync-labs-assets.getasset
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
