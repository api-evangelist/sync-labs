naftiko: 1.0.0-alpha2
info:
  label: Sync Labs API — Batch
  description: 'Sync Labs API — Batch. 3 operations. Lead operation: Create Batch Generation. Self-contained Naftiko capability
    covering one Sync Labs business surface.'
  tags:
  - Sync Labs
  - Batch
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SYNC_LABS_API_KEY: SYNC_LABS_API_KEY
capability:
  consumes:
  - type: http
    namespace: sync-labs-batch
    baseUri: https://api.sync.so/v2
    description: Sync Labs API — Batch business capability. Self-contained, no shared references.
    resources:
    - name: batch
      path: /batch
      operations:
      - name: createbatch
        method: POST
        description: Create Batch Generation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listbatches
        method: GET
        description: List Batches
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
    - name: batch-id
      path: /batch/{id}
      operations:
      - name: getbatch
        method: GET
        description: Get Batch Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Batch job ID
          required: true
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SYNC_LABS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: sync-labs-batch-rest
    port: 8080
    description: REST adapter for Sync Labs API — Batch. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/batch
      name: batch
      description: REST surface for batch.
      operations:
      - method: POST
        name: createbatch
        description: Create Batch Generation
        call: sync-labs-batch.createbatch
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listbatches
        description: List Batches
        call: sync-labs-batch.listbatches
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/batch/{id}
      name: batch-id
      description: REST surface for batch-id.
      operations:
      - method: GET
        name: getbatch
        description: Get Batch Status
        call: sync-labs-batch.getbatch
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sync-labs-batch-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sync Labs API — Batch. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-batch-generation
      description: Create Batch Generation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sync-labs-batch.createbatch
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-batches
      description: List Batches
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sync-labs-batch.listbatches
      with:
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: get-batch-status
      description: Get Batch Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sync-labs-batch.getbatch
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
