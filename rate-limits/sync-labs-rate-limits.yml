specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Sync Labs
providerId: sync-labs
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Artificial Intelligence
  - Lip Sync
  - Video
  - Rate Limiting
description: Sync Labs enforces two distinct kinds of limits. A request-rate limit applies per API key (60 rpm for POST /v2/generate, 600 rpm for everything else) and returns 429. A separate concurrency limit caps simultaneous PENDING/PROCESSING generations and is gated by subscription tier (1 / 3 / 6 / 15 / Custom). Both surface as 429 but require different remediation - rate-limit waits clear within a minute while concurrency requires a slot to free.
sources:
  - https://sync.so/docs/api-reference/guides/rate-limits
  - https://sync.so/pricing
responseCodes:
  throttled: 429
limits:
  - name: Generation Endpoint Rate Limit
    scope: key
    metric: requests_per_minute
    limit: 60
    timeFrame: minute
    notes: Applies to POST /v2/generate. Resets each minute.
  - name: Other Endpoints Rate Limit
    scope: key
    metric: requests_per_minute
    limit: 600
    timeFrame: minute
    notes: Applies to all non-generation endpoints (list, get, asset management, etc.).
  - name: Concurrent Generations - Hobbyist
    scope: account
    metric: concurrent_requests
    limit: 1
    notes: Maximum simultaneous PENDING/PROCESSING jobs on the Hobbyist plan.
  - name: Concurrent Generations - Creator
    scope: account
    metric: concurrent_requests
    limit: 3
    notes: Maximum simultaneous PENDING/PROCESSING jobs on the Creator plan.
  - name: Concurrent Generations - Growth
    scope: account
    metric: concurrent_requests
    limit: 6
    notes: Maximum simultaneous PENDING/PROCESSING jobs on the Growth plan.
  - name: Concurrent Generations - Scale
    scope: account
    metric: concurrent_requests
    limit: 15
    notes: Maximum simultaneous PENDING/PROCESSING jobs on the Scale plan.
  - name: Concurrent Generations - Enterprise
    scope: account
    metric: concurrent_requests
    limit: 'custom (negotiated)'
    notes: Enterprise concurrency is negotiated per-contract.
policies:
  - name: Exponential Backoff
    description: The docs recommend exponential backoff (1s, 2s, 4s, 8s, 16s using 2^attempt). Do not retry 429 responses immediately in tight loops.
  - name: Rate vs Concurrency Distinction
    description: A 429 from a rate-limit hit clears within a minute; a 429 from concurrency requires existing jobs to complete. Clients should differentiate the cause and back off accordingly.
  - name: Concurrency Monitoring
    description: Use the List Generations endpoint to track active jobs, implement client-side queuing, and use webhooks for completion notifications instead of polling.
  - name: Batch API
    description: Scale and Enterprise tiers gain access to the Batch API which automatically manages concurrency across larger workloads (up to 500 videos per batch).
maintainers:
